name: router_observer
description: A complete navigation observability toolkit; structured events, console logging, breadcrumbs, screen tracking analytics, and an in-app debug overlay.
version: 1.0.0
homepage: https://github.com/omar-hanafy/router_observer
repository: https://github.com/omar-hanafy/router_observer
issue_tracker: https://github.com/omar-hanafy/router_observer/issues
documentation: https://github.com/omar-hanafy/router_observer#readme

topics:
  - navigation
  - navigator
  - observability
  - telemetry
  - logging

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
