name: router_observer
description: A pluggable Flutter NavigatorObserver that emits structured navigation telemetry to sinks, with sampling, rate limiting, and PII redaction.
version: 0.1.0-dev.1
homepage: https://github.com/omar-hanafy/router_observer
repository: https://github.com/omar-hanafy/router_observer
issue_tracker: https://github.com/omar-hanafy/router_observer/issues
documentation: https://github.com/omar-hanafy/router_observer#readme

topics:
  - navigation
  - navigator
  - observability
  - telemetry
  - logging

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
