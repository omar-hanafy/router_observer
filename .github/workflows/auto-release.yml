name: Auto release

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: auto-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare package versions and validate lane
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          package=$(awk '/^name:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          if [[ "$package" != 'router_observer' ]]; then
            echo 'Expected package router_observer.'
            exit 1
          fi
          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$'
          if [[ "$GITHUB_REF_NAME" == 'main' && ! "$version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $version."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == 'dev' && ! "$version" =~ $prerelease_pattern ]]; then
            echo "dev requires a prerelease semantic version, got $version."
            exit 1
          fi
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'Branch creation detected; no release tag will be created.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          old_version=$(git show "$BEFORE_SHA:pubspec.yaml" | awk '/^version:/ {print $2; exit}' | tr -d "\"'")
          if [[ -z "$old_version" ]]; then
            echo 'Unable to read the previous version; refusing to create a release tag.'
            exit 1
          fi
          if [[ "$old_version" == "$version" ]]; then
            echo "Version remains $version; no release tag will be created."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'changed=true'
            echo "tag=$package-v$version"
            echo "value=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag push PAT
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'TAG_PUSH_PAT is required to push tags that trigger publishing.'
            exit 1
          fi

      - name: Verify tag is new
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tags=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || [[ -n "$remote_tags" ]]; then
            echo "Tag $RELEASE_TAG already exists. Never move or reuse a release tag."
            exit 1
          fi

      - name: Prepare release notes
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          lines = Path('CHANGELOG.md').read_text().splitlines(keepends=True)
          headings = [i for i, line in enumerate(lines) if line.strip() == f'## {version}']
          if len(headings) != 1:
              raise SystemExit(f'Expected one CHANGELOG.md section for {version}.')
          start = headings[0] + 1
          end = next((i for i in range(start, len(lines)) if lines[i].startswith('## ')), len(lines))
          notes = ''.join(lines[start:end]).strip()
          if not notes:
              raise SystemExit(f'CHANGELOG.md section for {version} is empty.')
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes + '\n')
          PYTHON

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_PAT }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$RELEASE_TAG" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA")
          if [[ "$GITHUB_REF_NAME" == 'dev' ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
